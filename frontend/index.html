<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/O Vermelhinho_favicon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#C62828" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Vermelhinho" />
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

  <!-- 🩺 Script de Recuperação (Executa apenas uma vez se detectar erro de deploy) -->
  <script>
    (function () {
      var lastReload = sessionStorage.getItem('ov_last_reload') || 0;
      var now = Date.now();

      window.addEventListener('error', function (e) {
        var msg = (e.message || "").toLowerCase();
        var target = e.target || {};
        var isScript = target.tagName === 'SCRIPT' || target.tagName === 'LINK';

        // Se for erro de carregamento de chunk ou mime-type (pós-deploy)
        if (isScript || msg.indexOf('chunkloaderror') !== -1 || msg.indexOf('loading chunk') !== -1 || msg.indexOf('type "text/html"') !== -1) {
          // Só recarrega se a última tentativa foi há mais de 30 segundos (evita loop)
          if (now - lastReload > 30000) {
            sessionStorage.setItem('ov_last_reload', now.toString());
            console.warn('⚠️ Detectado arquivo desatualizado. Sincronizando com o servidor...');
            setTimeout(function () { window.location.reload(true); }, 500);
          }
        }
      }, true);
    })();
  </script>

  <title>Overmelhinho</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <div style="display:none">Build: 2026-03-11 14:40</div>
</body>

</html>
