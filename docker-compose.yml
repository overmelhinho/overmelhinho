version: '3.8'

services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/var/www
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=vermelhinho
      - DB_USERNAME=root
      - DB_PASSWORD=root

  frontend:
    build: ./frontend
    ports:
      - "5173:80"

  db:
    image: mysql:8
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vermelhinho
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
