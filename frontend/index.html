<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css?family=Poppins:400,600,700&display=swap" rel="stylesheet">

  <!-- 🔧 Script de Auto-Cura v2 (Com proteção contra loops) -->
  <script>
    (function () {
      var RK = 'ov_reload_count';
      var count = parseInt(sessionStorage.getItem(RK) || '0');

      window.addEventListener('error', function (e) {
        var msg = (e.message || "").toLowerCase();
        var target = e.target || {};
        var tag = (target.tagName || "").toUpperCase();

        // Só recarrega se for erro de script/link (indicando chunk mismatch ou deploy 404/html)
        var isScript = tag === 'SCRIPT' || tag === 'LINK';
        var isDeployErr = msg.indexOf('type "text/html"') !== -1 ||
          msg.indexOf('chunkloaderror') !== -1 ||
          msg.indexOf('loading chunk') !== -1;

        if (isScript || isDeployErr) {
          if (count < 3) {
            sessionStorage.setItem(RK, (count + 1).toString());
            console.warn('⚠️ Erro de carregamento (deploy). Recarregando... tentativa: ' + (count + 1));
            setTimeout(function () { window.location.reload(true); }, 1500);
          } else {
            console.error('❌ Falha persistente após 3 tentativas.');
          }
        }
      }, true);

      // Reseta se o app rodar estável por 5s
      setTimeout(function () { sessionStorage.removeItem(RK); }, 5000);
    })();
  </script>

  <title>Overmelhinho</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <div style="display:none">Build: 2026-03-11 14:30</div>
</body>

</html>
